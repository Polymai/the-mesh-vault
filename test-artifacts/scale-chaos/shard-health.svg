      <rect x="89.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="114" y="51" text-anchor="middle">16</text><text x="114" y="405" text-anchor="end" transform="rotate(-38 114 405)">Upload complete</text><rect x="173.64" y="117.1875" width="48.72" height="247.8125" rx="5" fill="#e6ad23"/><text x="198" y="108.1875" text-anchor="middle">13</text><text x="198" y="405" text-anchor="end" transform="rotate(-38 198 405)">200 nodes offline</text><rect x="257.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="282" y="51" text-anchor="middle">16</text><text x="282" y="405" text-anchor="end" transform="rotate(-38 282 405)">Grace expired; rep</text><rect x="341.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="366" y="51" text-anchor="middle">16</text><text x="366" y="405" text-anchor="end" transform="rotate(-38 366 405)">250 new nodes join</text><rect x="425.64" y="136.25" width="48.72" height="228.75" rx="5" fill="#e6ad23"/><text x="450" y="127.25" text-anchor="middle">12</text><text x="450" y="405" text-anchor="end" transform="rotate(-38 450 405)">Four holders lost</text><rect x="509.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="534" y="51" text-anchor="middle">16</text><text x="534" y="405" text-anchor="end" transform="rotate(-38 534 405)">Rebalanced to newc</text><rect x="593.64" y="98.125" width="48.72" height="266.875" rx="5" fill="#2bc8ad"/><text x="618" y="89.125" text-anchor="middle">14</text><text x="618" y="405" text-anchor="end" transform="rotate(-38 618 405)">Anchors churn</text><rect x="677.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="702" y="51" text-anchor="middle">16</text><text x="702" y="405" text-anchor="end" transform="rotate(-38 702 405)">Old holders return</text><rect x="761.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="786" y="51" text-anchor="middle">16</text><text x="786" y="405" text-anchor="end" transform="rotate(-38 786 405)">Surplus retired</text><rect x="845.64" y="155.3125" width="48.72" height="209.6875" rx="5" fill="#df5a62"/><text x="870" y="146.3125" text-anchor="middle">11</text><text x="870" y="405" text-anchor="end" transform="rotate(-38 870 405)">Five holders lost</text><rect x="929.64" y="136.25" width="48.72" height="228.75" rx="5" fill="#e6ad23"/><text x="954" y="127.25" text-anchor="middle">12</text><text x="954" y="405" text-anchor="end" transform="rotate(-38 954 405)">One holder per seg</text><rect x="1013.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="1038" y="51" text-anchor="middle">16</text><text x="1038" y="405" text-anchor="end" transform="rotate(-38 1038 405)">Final repair</text><rect x="1097.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="1122" y="51" text-anchor="middle">16</text><text x="1122" y="405" text-anchor="end" transform="rotate(-38 1122 405)">Late holders retur</text><rect x="1181.64" y="60" width="48.72" height="305" rx="5" fill="#2bc8ad"/><text x="1206" y="51" text-anchor="middle">16</text><text x="1206" y="405" text-anchor="end" transform="rotate(-38 1206 405)">Final clean state</text><text x="18" y="70">16</text><text x="23" y="369">0</text>
      <rect x="1064" y="74.125" width="180" height="20" rx="4" fill="#f5fafb" opacity=".94"/><text class="legend" x="1238" y="88.125" text-anchor="end">Repair threshold 14</text>
      <rect x="1064" y="140.25" width="180" height="20" rx="4" fill="#f5fafb" opacity=".94"/><text class="legend" x="1238" y="154.25" text-anchor="end">Recovery requires 12</text>
